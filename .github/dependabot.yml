version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: typescript
        versions: ["7.x"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
