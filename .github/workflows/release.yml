name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Guard-rail self-test
        run: .claude/hooks/test-block-domustudio-writes.sh

      - name: Check the tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg" >&2
            exit 1
          fi

      - name: Build tarball
        run: npm pack

      - name: Compose the release notes
        run: |
          cat > release-notes.md <<'NOTES'
          Install globally, pinned to this tag:

          ```sh
          npm install -g --allow-git=all "github:Amministrazioni-DeSa/Domustudio-mcp#__TAG__"
          ```

          `--allow-git=all` is required on npm 12+, which defaults `allow-git` to
          `none`. The `install scripts blocked (prepare)` warning npm prints is
          benign — the build already ran in npm's isolated step.

          Prefer no git at all? The attached `.tgz` ships `dist/` prebuilt:

          ```sh
          npm install -g ./domustudio-mcp-server-__TAG_NOV__.tgz
          ```

          Print the absolute path to give the MCP client:

          ```sh
          echo "$(npm root -g)/domustudio-mcp-server/dist/index.js"
          ```

          See `CHANGELOG.md` for what changed and `README.md` for configuration.
          NOTES
          sed -i "s|__TAG__|${GITHUB_REF_NAME}|g; s|__TAG_NOV__|${GITHUB_REF_NAME#v}|g" release-notes.md
          cat release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            ./*.tgz
